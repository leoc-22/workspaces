# A layout spanning several projects. Open it with either launcher:
#   tmux-workspaces --file examples/layout.yaml
#   rex do workspace file=examples/layout.yaml
session:
  name: cow-stack
windows:
  - name: cow
    dir: ~/Developer/cow
    command: pnpm dev
  - name: cob
    dir: ~/Developer/cob
    command: pnpm dev
  - name: cos
    dir: ~/Developer/cos
    command: ./gradlew bootRun
    panes:
      - split: h
        command: mysql -P 3301 --protocol=tcp -u root -p
